
name: native-arm64-quality
on:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Record native host
        run: |
          mkdir -p results/arm64-quality
          { uname -a; uname -m; lscpu; free -h; } | tee results/arm64-quality/host.txt
          test "$(uname -m)" = "aarch64"
      - name: Install and verify retrieval model
        run: |
          python -m pip install --only-binary=:all: "setuptools>=69" wheel
          python -m pip install --only-binary=:all: --no-build-isolation -e .
          python scripts/fetch_model.py
          python scripts/evaluate_benchmark_routing.py --out results/arm64-quality/routing-quality.json
      - uses: actions/cache@v4
        id: llama-cache
        with:
          path: third_party/llama.cpp
          key: llama-b9623-kleidiai-${{ runner.arch }}
      - name: Require cached pinned llama.cpp
        run: test -x third_party/llama.cpp/build/bin/llama-server
      - name: Download pinned official Qwen GGUF
        run: |
          curl -fL --retry 4 -o models/qwen2.5-1.5b-instruct-q4_k_m.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/62a8d092b0a1047016f3edbd0fde387598727aa5/qwen2.5-1.5b-instruct-q4_k_m.gguf
          sha256sum models/qwen2.5-1.5b-instruct-q4_k_m.gguf | tee results/arm64-quality/llm-sha256.txt
      - name: Run complete quality audit
        run: |
          third_party/llama.cpp/build/bin/llama-server -m models/qwen2.5-1.5b-instruct-q4_k_m.gguf --host 127.0.0.1 --port 8080 -c 16384 -t 4 --jinja > results/arm64-quality/llama-server.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8080/health && LLAMA_READY=1 && break; sleep 1; done
          test "${LLAMA_READY:-0}" = 1
          python -m mcp_prism.cli proxy --host 127.0.0.1 --port 8090 --upstream http://127.0.0.1:8080 > results/arm64-quality/prism.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8090/health && PRISM_READY=1 && break; sleep 1; done
          test "${PRISM_READY:-0}" = 1
          python scripts/evaluate_llm_quality.py --out results/arm64-quality/quality.json
          python scripts/evaluate_workflows.py --out results/arm64-quality/development-workflows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-arm64-quality-results
          path: results/arm64-quality
          if-no-files-found: error

